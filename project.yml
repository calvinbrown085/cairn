name: Cairn

options:
  bundleIdPrefix: com.calvinbrown
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2620"

packages:
  SwiftReadability:
    path: Packages/SwiftReadability

fileGroups:
  - README.md
  - ROADMAP.md
  - project.yml

settings:
  base:
    DEVELOPMENT_TEAM: ZM4J56DC3Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Cairn:
    type: application
    platform: iOS
    sources:
      - path: Cairn
    settings:
      base:
        PRODUCT_NAME: Cairn
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinbrown.Cairn
        INFOPLIST_FILE: Cairn/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cairn/Cairn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE: NO
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - target: CairnShareExtension
        embed: true
        codeSign: true
      - package: SwiftReadability

  CairnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CairnUITests
    dependencies:
      - target: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinbrown.Cairn.UITests
        TEST_TARGET_NAME: Cairn
        GENERATE_INFOPLIST_FILE: YES

  CairnShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CairnShareExtension
      - path: Cairn/Services/SharedInbox.swift
      - path: Cairn/Services/AppGroup.swift
      - path: Cairn/Design/Palette.swift
    settings:
      base:
        PRODUCT_NAME: CairnShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinbrown.Cairn.ShareExtension
        INFOPLIST_FILE: CairnShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CairnShareExtension/CairnShareExtension.entitlements

schemes:
  Cairn:
    build:
      targets:
        Cairn: all
        CairnUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CairnUITests
