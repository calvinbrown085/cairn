name: Stacks

options:
  bundleIdPrefix: com.calvinbrown
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2620"

packages:
  SwiftReadability:
    path: Packages/SwiftReadability

fileGroups:
  - README.md
  - ROADMAP.md
  - project.yml

settings:
  base:
    DEVELOPMENT_TEAM: ZM4J56DC3Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Stacks:
    type: application
    platform: iOS
    sources:
      - path: Stacks
    settings:
      base:
        PRODUCT_NAME: Stacks
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinbrown.Stacks
        INFOPLIST_FILE: Stacks/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stacks/Stacks.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE: NO
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - target: StacksShareExtension
        embed: true
        codeSign: true
      - package: SwiftReadability

  StacksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StacksUITests
    dependencies:
      - target: Stacks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinbrown.Stacks.UITests
        TEST_TARGET_NAME: Stacks
        GENERATE_INFOPLIST_FILE: YES

  StacksShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: StacksShareExtension
      - path: Stacks/Services/SharedInbox.swift
      - path: Stacks/Services/AppGroup.swift
      - path: Stacks/Design/Palette.swift
    settings:
      base:
        PRODUCT_NAME: StacksShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinbrown.Stacks.ShareExtension
        INFOPLIST_FILE: StacksShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: StacksShareExtension/StacksShareExtension.entitlements

schemes:
  Stacks:
    build:
      targets:
        Stacks: all
        StacksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StacksUITests
