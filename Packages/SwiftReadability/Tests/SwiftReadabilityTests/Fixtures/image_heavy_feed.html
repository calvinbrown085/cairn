<h1>A Week of Sunsets</h1>
<p>Seven evenings, seven skies, shot from the same stretch of shoreline
with nothing but a phone and a folding chair.</p>
<figure><img src="https://example.com/photos/sunset-01.jpg" width="800" height="600" alt="Orange sky over calm water"><figcaption>Monday: clear and still.</figcaption></figure>
<figure><img src="https://example.com/photos/sunset-02.jpg" width="800" height="600" alt="Pink and purple clouds"><figcaption>Tuesday: high clouds caught the color.</figcaption></figure>
<figure><img src="https://example.com/photos/sunset-03.jpg" width="800" height="600" alt="Storm clouds breaking"><figcaption>Wednesday: a storm broke just in time.</figcaption></figure>
<figure><img src="https://example.com/photos/sunset-04.jpg" width="800" height="600" alt="Gulls flying over water"><figcaption>Thursday: gulls followed the tide out.</figcaption></figure>
<figure><img src="https://example.com/photos/sunset-05.jpg" width="800" height="600" alt="Deep red horizon"><figcaption>Friday: the deepest red of the week.</figcaption></figure>
<figure><img src="https://example.com/photos/sunset-06.jpg" width="800" height="600" alt="Hazy pale sky"><figcaption>Saturday: haze softened everything.</figcaption></figure>
<figure><img src="https://example.com/photos/sunset-07.jpg" width="800" height="600" alt="Silhouetted pier at dusk"><figcaption>Sunday: the pier held the last light.</figcaption></figure>
<p>Nothing here is edited beyond a crop; the color is whatever the sky and
the sensor agreed on that evening.</p>
